<script>
/* The letters start off screen on every side, each at its own angle, and fly straight in, turning as they come.
   They meet in the middle and collide: they knock each other back and spin off. Then every letter snaps to its
   place in the block, like a magnet, and the name stands still and straight. The whole run is worked out before
   it plays, at 240 steps a second, and each frame is drawn by the page itself so the edges stay hard in motion.
   Tap to run it again. No motion if the system asks for less. */
(function () {
  var root = document.documentElement, svg = document.querySelector('.mark svg');
  if (!svg || !window.requestAnimationFrame || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    root.classList.remove('cue');
    return;
  }

  var DT = 1 / 240, ARRIVE = .95, SNAP = 2.12, END = 2.85;     /* seconds */
  var E = .96, DRAG = 1.1, SPIN_DRAG = .9, FRICTION = .4;     /* restitution, damping after first contact, contact friction */
  var W0 = 2 * Math.PI * 6, Z = .9;                         /* a brisk, nearly critically damped snap into attention */
  var D2R = Math.PI / 180;

  var L = Array.prototype.map.call(svg.querySelectorAll('use'), function (u) {
    var d = u.dataset, box = svg.querySelector(u.getAttribute('href')).getBBox();
    var hw = box.width * d.s / 2, hh = box.height * d.s / 2, m = hw * hh;
    return { u: u, tx: +d.x, ty: +d.y, s: +d.s, d: +d.d,
             hw: hw, hh: hh, ox: (box.x + box.width / 2) * d.s,
             oy: (box.y + box.height / 2) * d.s, m: m, inertia: m * (hw * hw + hh * hh) / 3 };
  });
  var n = L.length, track = null, start = null, playing = false, animationTime = 0;
  var NS = 'http://www.w3.org/2000/svg';
  L.forEach(function (l, index) {
    var glyph = svg.querySelector(l.u.getAttribute('href')), box = glyph.getBBox();
    var x = box.x, y = box.y, w = box.width, h = box.height;
    var points = [[x,y], [x+w*.5,y], [x+w,y], [x+w,y+h*.5],
                  [x+w,y+h], [x+w*.5,y+h], [x,y+h], [x,y+h*.5]];
    l.shards = points.map(function (point, i) {
      var next = points[(i + 1) % points.length], id = 'shard-' + index + '-' + i;
      var clip = document.createElementNS(NS, 'clipPath'), polygon = document.createElementNS(NS, 'polygon');
      clip.id = id; clip.setAttribute('clipPathUnits', 'userSpaceOnUse');
      polygon.setAttribute('points', (x+w/2) + ',' + (y+h/2) + ' ' + point.join(',') + ' ' + next.join(','));
      clip.appendChild(polygon); svg.querySelector('defs').appendChild(clip);
      var group = document.createElementNS(NS, 'g'), use = document.createElementNS(NS, 'use');
      use.setAttribute('href', l.u.getAttribute('href')); use.setAttribute('clip-path', 'url(#' + id + ')');
      group.appendChild(use); group.style.display = 'none'; svg.appendChild(group);
      return { group: group, dx: ((point[0]+next[0])/2-x-w/2) * l.s,
               dy: ((point[1]+next[1])/2-y-h/2) * l.s, spin: 0 };
    });
  });

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function draw(l, x, y, a) {
    var transform = 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ') rotate(' + a.toFixed(2) + ') scale(' + l.s + ')';
    l.u.setAttribute('transform', transform);
    var age = animationTime - l.breakAt;
    var broken = age >= 0 && animationTime < 2.02;
    l.u.style.display = broken ? 'none' : '';
    /* Pieces burst apart quickly, then the magnetic pull reunites every seam. */
    var gather = Math.max(0, Math.min(1, (animationTime - 1.35) / .65));
    var envelope = (1 - Math.exp(-Math.max(0, age) * 12)) * (1 - gather * gather * (3 - 2 * gather));
    l.shards.forEach(function (shard) {
      shard.group.style.display = broken ? '' : 'none';
      if (!broken) return;
      var dx = shard.dx * 1.7 * envelope / l.s;
      var dy = (shard.dy * 1.7 + Math.max(0, age) * 45) * envelope / l.s;
      shard.group.setAttribute('transform', transform + ' translate(' + dx + ' ' + dy + ') rotate(' +
        (shard.spin * Math.max(0, age) * envelope) + ' ' + (l.ox / l.s) + ' ' + (l.oy / l.s) + ')');
    });
  }
  function rest() { animationTime = END; L.forEach(function (l) { draw(l, l.tx, l.ty, 0); }); }

  function bounds(o) {
    var c = Math.cos(o.a * D2R), s = Math.sin(o.a * D2R), l = o.l;
    return { x: o.x + c * l.ox - s * l.oy, y: o.y + s * l.ox + c * l.oy,
             axes: [{ x: c, y: s }, { x: -s, y: c }] };
  }
  function radius(l, box, axis) {
    return l.hw * Math.abs(box.axes[0].x * axis.x + box.axes[0].y * axis.y) +
           l.hh * Math.abs(box.axes[1].x * axis.x + box.axes[1].y * axis.y);
  }
  function collide(A, C) {
    var a = bounds(A), c = bounds(C), dx = c.x - a.x, dy = c.y - a.y;
    var axes = a.axes.concat(c.axes), depth = Infinity, normal;
    for (var i = 0; i < axes.length; i++) {
      var axis = axes[i], distance = dx * axis.x + dy * axis.y;
      var overlap = radius(A.l, a, axis) + radius(C.l, c, axis) - Math.abs(distance);
      if (overlap <= 0) return;
      if (overlap < depth) {
        depth = overlap;
        var sign = distance < 0 ? -1 : 1;
        normal = { x: axis.x * sign, y: axis.y * sign };
      }
    }
    var nx = normal.x, ny = normal.y, tx = -ny, ty = nx;
    /* Midpoint of the shared face span gives a stable contact even face-on. */
    var amin = a.x * tx + a.y * ty, cmin = c.x * tx + c.y * ty;
    var ar = radius(A.l, a, { x: tx, y: ty }), cr = radius(C.l, c, { x: tx, y: ty });
    var tangent = (Math.max(amin - ar, cmin - cr) + Math.min(amin + ar, cmin + cr)) / 2;
    var face = (a.x * nx + a.y * ny + radius(A.l, a, normal) +
                c.x * nx + c.y * ny - radius(C.l, c, normal)) / 2;
    var px = nx * face + tx * tangent, py = ny * face + ty * tangent;
    var ax = px - A.x, ay = py - A.y, cx = px - C.x, cy = py - C.y;
    var ia = 1 / A.l.m, ic = 1 / C.l.m, iiA = 1 / A.l.inertia, iiC = 1 / C.l.inertia;
    var wa = A.va * D2R, wc = C.va * D2R;
    var vx = C.vx - wc * cy - A.vx + wa * ay;
    var vy = C.vy + wc * cx - A.vy - wa * ax;
    var vn = vx * nx + vy * ny;
    if (vn < 0) {
      var an = ax * ny - ay * nx, cn = cx * ny - cy * nx;
      var impulse = -(1 + (vn < -40 ? E : 0)) * vn / (ia + ic + an * an * iiA + cn * cn * iiC);
      var at = ax * ty - ay * tx, ct = cx * ty - cy * tx;
      var friction = -(vx * tx + vy * ty) / (ia + ic + at * at * iiA + ct * ct * iiC);
      friction = Math.max(-FRICTION * impulse, Math.min(FRICTION * impulse, friction));
      var jx = impulse * nx + friction * tx, jy = impulse * ny + friction * ty;
      A.vx -= jx * ia; A.vy -= jy * ia; C.vx += jx * ic; C.vy += jy * ic;
      A.va -= (ax * jy - ay * jx) * iiA / D2R;
      C.va += (cx * jy - cy * jx) * iiC / D2R;
      A.hit = C.hit = true;
    }
    var push = Math.max(0, depth - .25) * .65 / (ia + ic);
    A.x -= nx * push * ia; A.y -= ny * push * ia;
    C.x += nx * push * ic; C.y += ny * push * ic;
  }

  function simulate() {
    var vb = svg.viewBox.baseVal, box = svg.getBoundingClientRect(), k = vb.width / (box.width || 1);
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var x0 = (0 - box.left) * k, x1 = (vw - box.left) * k, y0 = (0 - box.top) * k, y1 = (vh - box.top) * k;
    var cx = vb.width / 2, cy = vb.height / 2;

    /* A tight, synchronized arrival makes the letters slam into the same area.
       Lower drag lets the rebounds carry through before the final snap. */
    /* every side: the directions are spread evenly round the circle and dealt out at random */
    var deal = L.map(function (_, i) { return i; });
    for (var i = n - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = deal[i]; deal[i] = deal[j]; deal[j] = t; }
    var turn = Math.random() * 2 * Math.PI;

    L.forEach(function (l) {
      l.breakAt = Infinity;
      l.shards.forEach(function (shard) { shard.spin = rnd(220, 640) * (Math.random() < .5 ? -1 : 1); });
    });
    var B = L.map(function (l, i) {
      var a = turn + deal[i] / n * 2 * Math.PI + rnd(-.1, .1), dx = Math.cos(a), dy = Math.sin(a);
      var ex = dx > 0 ? (x1 - cx) / dx : dx < 0 ? (x0 - cx) / dx : Infinity;
      var ey = dy > 0 ? (y1 - cy) / dy : dy < 0 ? (y0 - cy) / dy : Infinity;
      var far = Math.min(ex, ey) + l.d + rnd(13, 144);
      var x = cx + dx * far, y = cy + dy * far;
      var pa = rnd(0, 2 * Math.PI), pr = Math.sqrt(Math.random()) * vb.width * .035;
      var px = cx + Math.cos(pa) * pr, py = cy + Math.sin(pa) * pr * .6, T = ARRIVE + rnd(-.02, .02);
      var spin = rnd(25, 65) * (Math.random() < .5 ? -1 : 1);
      return { l: l, x: x, y: y, vx: (px - x) / T, vy: (py - y) / T, a: rnd(-18, 18), va: spin, hit: false,
               snap: SNAP, ta: 0 };
    });

    var steps = Math.ceil(END / DT), out = new Float32Array((steps + 1) * n * 3);
    for (var s = 0; s <= steps; s++) {
      var now = s * DT;
      /* Rotating glyph bounds meet at a contact point: narrow letters no longer
         bounce off an oversized circle. Two solver passes clear crowded impacts. */
      for (var pass = 0; pass < 2; pass++) {
        for (var p = 0; p < n; p++) {
          var A = B[p];
          if (now < .68 || now >= 1.35) continue;
          for (var q = p + 1; q < n; q++) {
            var C = B[q];
            if (now >= C.snap) continue;
            collide(A, C);
          }
        }
      }
      for (var b = 0; b < n; b++) {
        var o = B[b], l = o.l;
        if (o.hit && l.breakAt === Infinity) l.breakAt = now + .10;
        if (now >= o.snap) {
          /* the snap: pulled to its place and upright, carrying the speed it had */
          if (!o.locked) { o.locked = true; o.ta = Math.round(o.a / 360) * 360; }
          o.vx += (-W0 * W0 * (o.x - l.tx) - 2 * Z * W0 * o.vx) * DT;
          o.vy += (-W0 * W0 * (o.y - l.ty) - 2 * Z * W0 * o.vy) * DT;
          o.va += (-W0 * W0 * (o.a - o.ta) - 2 * Z * W0 * o.va) * DT;
        } else if (o.hit) {
          var f = Math.exp(-DRAG * DT);
          o.vx *= f; o.vy *= f; o.va *= Math.exp(-SPIN_DRAG * DT);
        }
        o.va = Math.max(-1440, Math.min(1440, o.va));
        o.x += o.vx * DT; o.y += o.vy * DT; o.a += o.va * DT;
        /* Keep the wreckage in view so the reformed letters can be seen
           before the whole squad snaps to attention on the same beat. */
        if (o.hit && now < SNAP) {
          var margin = Math.max(l.hw, l.hh) + 12;
          if (o.x < x0 + margin) { o.x = x0 + margin; o.vx = Math.abs(o.vx) * .6; }
          if (o.x > x1 - margin) { o.x = x1 - margin; o.vx = -Math.abs(o.vx) * .6; }
          if (o.y < y0 + margin) { o.y = y0 + margin; o.vy = Math.abs(o.vy) * .6; }
          if (o.y > y1 - margin) { o.y = y1 - margin; o.vy = -Math.abs(o.vy) * .6; }
        }
        var at = (s * n + b) * 3;
        out[at] = o.x; out[at + 1] = o.y; out[at + 2] = o.a;
      }
    }
    return { steps: steps, pos: out };
  }

  function frame(now) {
    if (start === null) start = now;
    var f = (now - start) / 1000 / DT;
    if (f >= track.steps) { rest(); playing = false; return; }
    animationTime = (now - start) / 1000;
    var s = Math.floor(f), u = f - s, P = track.pos;
    for (var b = 0; b < n; b++) {
      var i = (s * n + b) * 3, j = ((s + 1) * n + b) * 3;
      draw(L[b], P[i] + (P[j] - P[i]) * u, P[i + 1] + (P[j + 1] - P[i + 1]) * u, P[i + 2] + (P[j + 2] - P[i + 2]) * u);
    }
    requestAnimationFrame(frame);
  }

  function play() {
    if (playing) return;
    playing = true; start = null; animationTime = 0; track = simulate();
    var P = track.pos;
    L.forEach(function (l, b) { draw(l, P[b * 3], P[b * 3 + 1], P[b * 3 + 2]); });
    requestAnimationFrame(frame);
  }

  play();
  root.classList.remove('cue');
  document.addEventListener('click', play);
})();
</script>
</body>
</html>
